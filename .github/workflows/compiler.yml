name: Renoir MIUI 14 - Kernel Hana + SukiSU Ultra (+SUSFS)

# Dasar kernel: Hana-kernel (ponces/android_kernel_xiaomi_sm8350-miui, Linux 5.4.283).
# Patch SUSFS diambil otomatis dari release "susfs-hana-latest" (dibuat oleh workflow "Build SUSFS patch").
# Urutan pakai: 1) jalankan "Build SUSFS patch"  2) jalankan workflow ini.

on:
  workflow_dispatch:
    inputs:
      root:
        description: "sukisu = SukiSU Ultra | ksunext = sama persis dengan rilis Hana (uji dasar) | none = tanpa root"
        required: true
        type: choice
        default: "sukisu"
        options:
          - sukisu
          - ksunext
          - none
      susfs:
        description: "Pasang SUSFS (hanya kalau root = sukisu)"
        required: true
        type: boolean
        default: true
      kpm:
        description: "Coba aktifkan KPM (eksperimen, bisa gagal compile di 5.4)"
        required: true
        type: boolean
        default: false
      adbroot:
        description: "Coba aktifkan ADB Root (eksperimen)"
        required: true
        type: boolean
        default: false
      kernel_ref:
        description: "Branch/tag kernel Hana"
        required: true
        default: "main"
      suki_ref:
        description: "Commit SukiSU-Ultra (harus sama dengan yang dipakai workflow SUSFS)"
        required: true
        default: "b1d534bc41941b2c818d7a1a1dac341e4aabfc2d"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel Hana
        uses: actions/checkout@v4
        with:
          repository: ponces/android_kernel_xiaomi_sm8350-miui
          ref: ${{ inputs.kernel_ref }}
          submodules: true
          fetch-depth: 1
          path: kernel

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang curl flex git libssl-dev lld llvm \
            python3 python-is-python3 zip zstd file cpio xz-utils
          clang --version | head -1

      - name: Info sumber kernel
        run: |
          cd kernel
          git log -1 --oneline || true
          make -s kernelversion
          ls -la drivers/kernelsu || true
          ls KernelSU-Next | head -5 || true

      - name: Ganti KernelSU-Next dengan SukiSU Ultra + penyesuaian kernel 5.4
        if: ${{ inputs.root == 'sukisu' }}
        env:
          SUKI_REF: ${{ inputs.suki_ref }}
        run: |
          set -e
          cd kernel

          # drivers/kernelsu adalah symlink ke ../KernelSU-Next/kernel (bawaan Hana).
          # Folder KernelSU-Next kita ganti isinya dengan SukiSU, symlink tetap dipakai.
          # Pakai fetch (bukan clone -b) supaya bisa menerima nomor commit maupun nama branch.
          rm -rf KernelSU-Next
          git init -q KernelSU-Next
          git -C KernelSU-Next remote add origin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          git -C KernelSU-Next fetch -q --depth=1 origin "$SUKI_REF"
          git -C KernelSU-Next checkout -q FETCH_HEAD
          git -C KernelSU-Next log -1 --oneline
          test -f KernelSU-Next/kernel/Kconfig || { echo "::error::SukiSU tidak punya kernel/Kconfig di $SUKI_REF"; exit 1; }
          test -f drivers/kernelsu/Kconfig || { echo "::error::symlink drivers/kernelsu rusak"; exit 1; }
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig

          K=KernelSU-Next/kernel

          # 1. linux/static_call.h hanya ada di kernel 5.10+
          if [ ! -f include/linux/static_call.h ]; then
            grep -rl "linux/static_call.h" "$K" | xargs -r sed -i -E 's|^([[:space:]]*)#[[:space:]]*include <linux/static_call.h>|\1/* disabled for 5.4: linux/static_call.h */|'
          fi

          # 2. linux/hex.h tidak ada di kernel 5.4
          if [ ! -f include/linux/hex.h ]; then
            grep -rl "<linux/hex.h>" "$K" | xargs -r sed -i 's|<linux/hex.h>|<linux/kernel.h>|'
          fi

          # 3. makro fallthrough (kernel Hana sudah punya; ini hanya jaga-jaga)
          if ! grep -qs "define[[:space:]]\+fallthrough" include/linux/compiler_attributes.h include/linux/compiler.h include/linux/compiler-clang.h; then
            F="$K/kernel_includes.h"
            if [ -f "$F" ]; then
              last=$(grep -n '^#include' "$F" | tail -1 | cut -d: -f1)
              sed -i "${last}a #ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif" "$F"
            fi
          fi

          # 4. arch.h: sudah ada di SukiSU. Ambil dari luar hanya kalau memang hilang.
          if ! find "$K" -name arch.h | grep -q .; then
            curl -fsSL -o "$K/include/arch.h" https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/include/arch.h \
              || echo "::warning::gagal mengambil arch.h"
          fi

          # 5. cpu_spoof.c memakai clocksource->vdso_clock_mode (baru ada di kernel 5.10+).
          #    Field int ditambah di AKHIR struct clocksource supaya offset field lain tidak bergeser.
          CLK=include/linux/clocksource.h
          if grep -rq "vdso_clock_mode" "$K" && ! grep -q "vdso_clock_mode;" "$CLK"; then
            awk '
              /^struct clocksource[[:space:]]*\{/ { in_cs=1 }
              in_cs && /^\}.*;/ {
                print "\t/* compat 5.4: dipakai SukiSU cpu_spoof, tidak dibaca vDSO kernel 5.4 */"
                print "\tint vdso_clock_mode;"
                in_cs=0
              }
              { print }
            ' "$CLK" > "$CLK.new" && mv "$CLK.new" "$CLK"
            grep -q "int vdso_clock_mode;" "$CLK" || { echo "::error::gagal menyisipkan vdso_clock_mode"; exit 1; }
          fi

          # 6. fungsi SUSFS dipanggil walau SUSFS tidak dipasang
          PO=$(find "$K" -name pkg_observer.c | head -1)
          if [ -n "$PO" ] && grep -q "susfs_parse_priority_app_strings" "$PO"; then
            line=$(grep -n '^#include' "$PO" | tail -1 | cut -d: -f1)
            sed -i "${line}a #ifndef CONFIG_KSU_SUSFS\n#ifndef susfs_parse_priority_app_strings\n#define susfs_parse_priority_app_strings(...) (0)\n#endif\n#endif" "$PO"
          fi

          # 7. matikan preinit SukiSU (butuh header userspace dan fitur kernel 5.3+)
          if [ -f "$K/Makefile" ]; then
            sed -i -E 's|^([[:space:]]*KSU_UAPI_INC[[:space:]]*:?=[[:space:]]*).*$|\1$(objtree)/usr/include-ksu-disabled|' "$K/Makefile"
            grep -n "KSU_UAPI_INC :=" "$K/Makefile" || echo "::warning::KSU_UAPI_INC tidak ditemukan"
          fi

      - name: Pasang patch SUSFS (dari release susfs-hana-latest)
        if: ${{ inputs.root == 'sukisu' && inputs.susfs }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download susfs-hana-latest --repo "$GITHUB_REPOSITORY" \
            -p susfs-hana.patch -p susfs-hana.info -D "$RUNNER_TEMP" --clobber
          echo "=== info patch ==="
          cat "$RUNNER_TEMP/susfs-hana.info"

          # patch dibuat terhadap SukiSU tertentu; peringatkan kalau beda
          SHA=$(git -C kernel/KernelSU-Next rev-parse HEAD)
          grep -q "$SHA" "$RUNNER_TEMP/susfs-hana.info" || \
            echo "::warning::SukiSU yang dipakai ($SHA) BEDA dengan yang dipakai saat patch SUSFS dibuat. Jalankan ulang workflow SUSFS dengan suki_ref yang sama."

          cd kernel
          find . -name '*.rej' -not -path './.git/*' | sort > "$RUNNER_TEMP/rej_before.txt"
          set +e
          patch -p1 --batch --no-backup-if-mismatch -F2 < "$RUNNER_TEMP/susfs-hana.patch" | tee "$RUNNER_TEMP/susfs-apply.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "patch exit code: $rc"
          find . -name '*.rej' -not -path './.git/*' | sort > "$RUNNER_TEMP/rej_after.txt"
          new=$(comm -13 "$RUNNER_TEMP/rej_before.txt" "$RUNNER_TEMP/rej_after.txt")
          if [ -n "$new" ]; then
            for f in $new; do echo "################ REJ: $f"; cat "$f"; done
            echo "::error::patch SUSFS ada hunk gagal. Jalankan ulang workflow 'Build SUSFS patch' dengan kernel_ref yang sama."
            exit 1
          fi
          test -f fs/susfs.c || { echo "::error::fs/susfs.c tidak ada setelah patch"; exit 1; }
          echo "Patch SUSFS terpasang."

          echo "=== cek: fungsi ksu_handle_* yang dipanggil kernel vs yang didefinisikan SukiSU ==="
          K=KernelSU-Next/kernel
          for f in $(grep -rhoE '\bksu_handle_[a-z0-9_]+\(' fs kernel drivers/input mm security include 2>/dev/null | tr -d '(' | sort -u); do
            if grep -rhE "^([A-Za-z_][^;(]*[ *])?$f\(" "$K" --include=*.c 2>/dev/null | grep -vE '^extern |;[[:space:]]*$' | grep -q .; then
              echo "ok   $f"
            else
              echo "::warning::tidak ketemu definisi $f di SukiSU (kalau nanti error link 'undefined', ini penyebabnya)"
            fi
          done

      - name: Pasang hook manual SukiSU ke kernel (exec, faccessat, stat, read, input, reboot)
        if: ${{ inputs.root == 'sukisu' && !inputs.susfs }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/ksu_hooks.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Pasang hook manual SukiSU-Ultra (builtin) ke kernel 5.4 Hana.
          Pemakaian: python3 ksu_hooks.py <root-kernel>
          Setiap titik sisip dicari persis; kalau tidak ketemu, berhenti dengan pesan jelas."""
          import sys, os

          root = sys.argv[1]
          MARK = "KSU manual hook"


          def load(rel):
              with open(os.path.join(root, rel), "r", encoding="utf-8", errors="surrogateescape") as f:
                  return f.read()


          def save(rel, s):
              with open(os.path.join(root, rel), "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(s)


          def find(s, rel, anchor, start=0):
              i = s.find(anchor, start)
              if i < 0:
                  sys.exit("::error::[hook] titik sisip tidak ditemukan di %s: %r" % (rel, anchor))
              return i


          def ins_before(s, i, text):
              return s[:i] + text + s[i:]


          def patch(rel, fn):
              s = load(rel)
              if MARK in s:
                  print("[hook] %s sudah dipasang, dilewati" % rel)
                  return
              s = fn(s, rel)
              save(rel, s)
              print("[hook] OK  %s" % rel)


          def wrap(code):
              return "#ifdef CONFIG_KSU /* %s */\n%s#endif\n" % (MARK, code)


          # ---------- fs/exec.c : execve / execveat (+ compat) lewat do_execveat_common ----------
          def exec_c(s, rel):
              a = find(s, rel, "static int do_execveat_common(int fd, struct filename *filename,")
              s = ins_before(s, a, wrap(
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n"
                  "\t\t\t       void *envp, int *flags);\n"))
              r = find(s, rel, "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);", a)
              return ins_before(s, r, wrap(
                  "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"))


          # ---------- fs/open.c : faccessat ----------
          def open_c(s, rel):
              a = find(s, rel, "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)")
              b = find(s, rel, "{\n", a) + 2
              s = s[:b] + wrap("\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n") + s[b:]
              return ins_before(s, a, wrap(
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *__unused_flags);\n"))


          # ---------- fs/read_write.c : read ----------
          def read_c(s, rel):
              a = find(s, rel, "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)")
              r = find(s, rel, "\treturn ksys_read(fd, buf, count);", a)
              s = ins_before(s, r, wrap(
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_sys_read(fd, &buf, &count);\n"))
              return ins_before(s, a, wrap(
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,\n"
                  "\t\t\t       size_t *count_ptr);\n"))


          # ---------- fs/stat.c : newfstatat ----------
          def stat_c(s, rel):
              a = find(s, rel, "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,")
              r = find(s, rel, "\terror = vfs_fstatat(dfd, filename, &stat, flag);", a)
              s = ins_before(s, r, wrap("\tksu_handle_stat(&dfd, &filename, &flag);\n"))
              return ins_before(s, a, wrap(
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"))


          # ---------- drivers/input/input.c : input_event ----------
          def input_c(s, rel):
              a = find(s, rel, "void input_event(struct input_dev *dev,")
              k = "\tunsigned long flags;\n"
              b = find(s, rel, k, a) + len(k)
              s = s[:b] + wrap(
                  "\tif (unlikely(ksu_input_hook))\n"
                  "\t\tksu_handle_input_handle_event(&type, &code, &value);\n") + s[b:]
              return ins_before(s, a, wrap(
                  "extern bool ksu_input_hook __read_mostly;\n"
                  "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"))


          # ---------- kernel/reboot.c : reboot (jalur supercall / manager) ----------
          def reboot_c(s, rel):
              a = find(s, rel, "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,")
              k = "\tint ret = 0;\n"
              b = find(s, rel, k, a) + len(k)
              s = s[:b] + wrap("\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n") + s[b:]
              return ins_before(s, a, wrap(
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"))


          patch("fs/exec.c", exec_c)
          patch("fs/open.c", open_c)
          patch("fs/read_write.c", read_c)
          patch("fs/stat.c", stat_c)
          patch("drivers/input/input.c", input_c)
          patch("kernel/reboot.c", reboot_c)
          print("[hook] semua hook terpasang")
          PYEOF
          cd kernel
          python3 -I "$RUNNER_TEMP/ksu_hooks.py" "$PWD"
          echo "=== hasil sisipan ==="
          grep -rn "KSU manual hook" fs kernel drivers/input | head -40

      - name: Build kernel
        env:
          ROOT_MODE: ${{ inputs.root }}
          SUSFS: ${{ inputs.susfs }}
          KPM: ${{ inputs.kpm }}
          ADBROOT: ${{ inputs.adbroot }}
        run: |
          cd kernel
          OUT=out
          MK=(
            ARCH=arm64 CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM_IAS=1 LLVM=1
            O=$OUT
          )
          if [ "$ROOT_MODE" = "sukisu" ]; then
            MK+=("KCFLAGS=-DKSU_NO_PREINIT")
          fi
          JOBS="$(nproc --all)"

          # 1. config dasar milik Hana (sama dengan build resmi mereka)
          make "${MK[@]}" vendor/renoir_defconfig

          # 2. atur root
          case "$ROOT_MODE" in
            sukisu)
              ./scripts/config --file $OUT/.config -e KSU -d KSU_DEBUG
              if [ "$SUSFS" = "true" ]; then
                ./scripts/config --file $OUT/.config -e KSU_SUSFS \
                  -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
                  -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_OPEN_REDIRECT \
                  -e KSU_SUSFS_SUS_MAP
              else
                ./scripts/config --file $OUT/.config -d KSU_SUSFS
              fi
              if [ "$KPM" = "true" ]; then
                ./scripts/config --file $OUT/.config -e KPM
              else
                ./scripts/config --file $OUT/.config -d KPM
              fi
              if [ "$ADBROOT" = "true" ]; then
                ./scripts/config --file $OUT/.config -e KSU_FEATURE_ADBROOT
              else
                ./scripts/config --file $OUT/.config -d KSU_FEATURE_ADBROOT
              fi
              ;;
            none)
              ./scripts/config --file $OUT/.config -d KSU
              ;;
            ksunext)
              echo "Mode ksunext: pakai config Hana apa adanya"
              ;;
          esac
          make "${MK[@]}" olddefconfig

          echo "=== Cek config penting ==="
          grep -E "^(# )?CONFIG_(KSU|KPM|KPROBES|LTO_CLANG|CFI_CLANG|LOCALVERSION|MODVERSIONS)[A-Z_]*[= ]" $OUT/.config || true
          if [ "$ROOT_MODE" = "sukisu" ]; then
            grep -q "^CONFIG_KSU=y" $OUT/.config || { echo "::error::CONFIG_KSU tidak aktif"; exit 1; }
            if [ "$SUSFS" = "true" ]; then
              if ! grep -q "^CONFIG_KSU_SUSFS=y" $OUT/.config; then
                echo "::error::CONFIG_KSU_SUSFS tidak aktif setelah olddefconfig (kemungkinan 'depends on' tidak terpenuhi). Baris terkait:"
                grep -n "KSU_SUSFS" $OUT/.config || true
                exit 1
              fi
            else
              if grep -q "^CONFIG_KSU_SUSFS=y" $OUT/.config; then echo "::error::KSU_SUSFS masih aktif padahal susfs=false"; exit 1; fi
            fi
            if [ "$KPM" = "true" ]  && ! grep -q "^CONFIG_KPM=y" $OUT/.config; then echo "::warning::KPM diminta tapi CONFIG_KPM tidak aktif (dependensi tidak terpenuhi)"; fi
            if [ "$ADBROOT" = "true" ] && ! grep -q "^CONFIG_KSU_FEATURE_ADBROOT=y" $OUT/.config; then echo "::warning::ADBROOT diminta tapi CONFIG_KSU_FEATURE_ADBROOT tidak aktif"; fi
          fi

          # 3. siapkan file otomatis (compile.h, flask.h) supaya driver bisa diperiksa sendirian
          if ! make "${MK[@]}" -j"$JOBS" prepare scripts > prep.log 2>&1; then
            echo "prepare gagal:"; tail -n 40 prep.log; exit 1
          fi
          make "${MK[@]}" -k -j"$JOBS" init/version.o security/selinux/ > gen.log 2>&1 || true
          if [ ! -f $OUT/include/generated/compile.h ] || [ ! -f $OUT/security/selinux/flask.h ]; then
            echo "::error::compile.h / flask.h tidak terbentuk. 40 baris terakhir gen.log:"
            tail -n 40 gen.log
            exit 1
          fi

          # 4. periksa driver root dulu, tampilkan SEMUA error sekaligus
          if [ "$ROOT_MODE" = "sukisu" ]; then
            echo "=== Kompilasi drivers/kernelsu (semua error sekaligus) ==="
            make "${MK[@]}" -k -j"$JOBS" drivers/kernelsu/ > ksu.log 2>&1 || true
            grep -n "^-- " ksu.log | head -20 || true
            echo "===================== SEMUA ERROR drivers/kernelsu ====================="
            grep -nE "error:|fatal error|undefined" ksu.log | head -80 || true
            if grep -qE "error:|fatal error" ksu.log; then
              echo "::error::Masih ada error di driver SukiSU (lihat daftar di atas)."
              exit 1
            fi
            echo "drivers/kernelsu lolos kompilasi."

            if [ "$SUSFS" = "true" ]; then
              echo "=== Kompilasi file SUSFS di kernel (semua error sekaligus) ==="
              make "${MK[@]}" -k -j"$JOBS" fs/susfs.o fs/namei.o fs/namespace.o fs/stat.o fs/readdir.o \
                fs/statfs.o fs/proc/ fs/notify/ security/selinux/ kernel/sys.o kernel/reboot.o kernel/kallsyms.o \
                mm/memory.o drivers/input/input.o > susfs.log 2>&1 || true
              grep -nE "error:|fatal error" susfs.log | head -80 || true
              if grep -qE "error:|fatal error" susfs.log; then
                echo "::error::Ada error di file yang disentuh SUSFS (lihat daftar di atas)."
                exit 1
              fi
              echo "File SUSFS lolos kompilasi."
            fi
          fi

          # 5. build penuh
          if ! make "${MK[@]}" -j"$JOBS" > build.log 2>&1; then
            echo "Build gagal. Ulang 1 thread untuk menampilkan error asli..."
            make "${MK[@]}" -j1 > build-retry.log 2>&1 || true
            echo "===================== BARIS ERROR ====================="
            grep -nE "error:|Error |\*\*\*|No rule|undefined|not found|fatal" build.log build-retry.log | head -40
            echo "================= 40 BARIS TERAKHIR ==================="
            tail -n 40 build-retry.log
            exit 1
          fi

          IMG=$OUT/arch/arm64/boot/Image
          test -s "$IMG" || { echo "::error::Image tidak ada"; exit 1; }
          file "$IMG"
          file "$IMG" | grep -qi "ARM64" || { echo "::error::Image bukan ARM64"; exit 1; }
          ls -la "$IMG"
          cat $OUT/include/config/kernel.release

          if [ "$ROOT_MODE" = "sukisu" ]; then
            echo "=== cek hook SukiSU di kernel jadi ==="
            n=$(llvm-nm $OUT/vmlinux 2>/dev/null | grep -c "ksu_handle_" || true)
            echo "simbol ksu_handle_* di vmlinux: $n"
            [ "$n" -gt 0 ] || echo "::warning::simbol ksu_handle_ tidak terlihat (bisa karena LTO meng-inline); cek log saat boot"
            if [ "$SUSFS" = "true" ]; then
              s=$(llvm-nm $OUT/vmlinux 2>/dev/null | grep -c "susfs_" || true)
              echo "simbol susfs_* di vmlinux: $s"
              [ "$s" -gt 0 ] || echo "::warning::simbol susfs_ tidak terlihat di vmlinux (LTO bisa meng-inline); cek di aplikasi manager"
            fi
          fi

      - name: Bungkus ZIP AnyKernel3 (pakai template resmi Hana)
        env:
          ROOT_MODE: ${{ inputs.root }}
          SUSFS: ${{ inputs.susfs }}
        run: |
          set -e
          cd kernel
          KVER=$(make -s kernelversion)
          TAG="$ROOT_MODE"
          if [ "$ROOT_MODE" = "sukisu" ] && [ "$SUSFS" = "true" ]; then TAG="sukisu-susfs"; fi
          NAME="Hana-${TAG}-renoir-$(date +%Y%m%d)-${KVER}"
          rm -rf "$GITHUB_WORKSPACE/ak3"
          cp -r scripts/ak3 "$GITHUB_WORKSPACE/ak3"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/ak3/Image"
          (cd "$GITHUB_WORKSPACE/ak3" && zip -q -r9 "$GITHUB_WORKSPACE/$NAME.zip" .)
          mkdir -p "$GITHUB_WORKSPACE/result"
          mv "$GITHUB_WORKSPACE/$NAME.zip" "$GITHUB_WORKSPACE/result/"
          cp out/.config "$GITHUB_WORKSPACE/result/config.txt"
          cp out/include/config/kernel.release "$GITHUB_WORKSPACE/result/" || true
          (cd "$GITHUB_WORKSPACE/result" && sha256sum *.zip > zip.sha256 && ls -la)
          unzip -l "$GITHUB_WORKSPACE/result/$NAME.zip" | head -30

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-Hana-${{ inputs.root }}
          path: result/
          if-no-files-found: error

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/*.log
          if-no-files-found: ignore
