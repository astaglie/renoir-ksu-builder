name: Renoir Custom Kernel Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Fetch Toolchain (Clang)
        run: |
          mkdir clang
          cd clang
          curl -LO "https://googlesource.com"
          tar -xf clang-r450784d.tar.gz
          cd ..

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-20 https://github.com kernel-source

      - name: Fetch Your Custom Defconfig
        run: |
          curl -so kernel-source/arch/arm64/configs/renoir_jp_defconfig https://githubusercontent.com{{ github.repository }}/main/renoir_jp_defconfig

      - name: Integrate SukiSU Ultra & SUSFS
        run: |
          cd kernel-source
          curl -LSs "https://githubusercontent.com" | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/renoir_jp_defconfig
          echo "CONFIG_KSU_ULTRA=y" >> arch/arm64/configs/renoir_jp_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/renoir_jp_defconfig
          cd ..

      - name: Compile Kernel
        run: |
          cd kernel-source
          export PATH=$(pwd)/../clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make O=out renoir_jp_defconfig
          make -j$(nproc --all) O=out CC=clang

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-SukiSU-Kernel
          path: kernel-source/out/arch/arm64/boot/Image.gz
