name: Renoir Kernel Build (MoRanYue tree + AOSP clang 11)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag dari MoRanYue/renoir-kernel"
        required: true
        default: "main"
      root:
        description: "Root yang dipasang"
        required: true
        type: choice
        default: "sukisu"
        options:
          - sukisu
          - bakasu
      hook_mode:
        description: "Mode hook SukiSU (hanya untuk sukisu)"
        required: true
        type: choice
        default: "tamper"
        options:
          - tamper
          - branchlink
      suki_ref:
        description: "Branch/tag SukiSU-Ultra"
        required: true
        default: "builtin"
      quick_check:
        description: "Cek cepat: hanya kompilasi drivers/kernelsu (tanpa build penuh)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Checkout kernel (beserta submodule)
        uses: actions/checkout@v4
        with:
          repository: MoRanYue/renoir-kernel
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1
          path: kernel

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gperf patch dwarves \
            libssl-dev libncurses-dev libelf-dev lz4 lzop rsync zip zlib1g-dev python3 cpio xz-utils \
            gcc-aarch64-linux-gnu
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Download AOSP clang 11 (r383902b)
        run: |
          mkdir -p tc/clang-r383902b
          curl -fL --retry 5 --retry-delay 10 -o tc/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz"
          tar xzf tc/clang.tar.gz -C tc/clang-r383902b
          rm -f tc/clang.tar.gz
          tc/clang-r383902b/bin/clang --version

      - name: Ganti root ke SukiSU Ultra + penyesuaian kernel 5.4
        if: ${{ inputs.root == 'sukisu' }}
        env:
          SUKI_REF: ${{ inputs.suki_ref }}
        run: |
          cd kernel
          echo "=== Hook BakaSU yang ada di source (konteks guard) ==="
          grep -n -B1 "ksu_handle_" fs/exec.c fs/open.c fs/stat.c fs/read_write.c kernel/sys.c kernel/reboot.c drivers/input/input.c 2>/dev/null | head -90 || true

          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 -b "$SUKI_REF" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          git -C KernelSU log -1 --oneline

          F=KernelSU/kernel/kernel_includes.h
          echo "=== include di kernel_includes.h ==="
          grep -n "#include" "$F" | head -60 || true

          # 1. static_call.h hanya ada di kernel 5.10+
          if grep -q "linux/static_call.h" "$F" && [ ! -f include/linux/static_call.h ]; then
            sed -i 's|^\(\s*\)#\s*include <linux/static_call.h>|\1/* disabled for 5.4: linux/static_call.h */|' "$F"
          fi

          # 2. linux/hex.h tidak ada di kernel lama
          if [ ! -f include/linux/hex.h ]; then
            grep -rl "<linux/hex.h>" KernelSU/kernel | xargs -r sed -i 's|<linux/hex.h>|<linux/kernel.h>|'
          fi

          # 3. makro fallthrough kalau belum ada
          if ! grep -qs "define fallthrough" include/linux/compiler_attributes.h include/linux/compiler.h include/linux/compiler-clang.h; then
            last=$(grep -n '^#include' "$F" | tail -1 | cut -d: -f1)
            sed -i "${last}a #ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif" "$F"
          fi

          # 4. arch.h kadang tidak ikut ter-commit di branch builtin (SukiSU-Ultra PR #974)
          if grep -rqE '#include "arch.h"' KernelSU/kernel && [ ! -f KernelSU/kernel/arch.h ]; then
            curl -fsSL -o KernelSU/kernel/arch.h https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/include/arch.h \
              || echo "::warning::gagal mengambil arch.h"
          fi

          # 5. vdso_clock_mode baru ada di kernel 5.7+ (kernel ini 5.4): bungkus pernyataan tunggalnya
          CS=KernelSU/kernel/extension/cpu_spoof.c
          if [ -f "$CS" ] && ! grep -q "vdso_clock_mode" include/linux/clocksource.h; then
            echo "=== konteks vdso_clock_mode di cpu_spoof.c (sebelum) ==="
            grep -n -B3 -A3 "vdso_clock_mode" "$CS" || true
            awk '
              /vdso_clock_mode/ && $0 !~ /^[[:space:]]*(if|while|for|return|else)/ && $0 ~ /;[[:space:]]*$/ && $0 !~ /^[[:space:]]*#/ {
                print "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 7, 0)"; print; print "#endif"; next }
              { print }' "$CS" > "$CS.new" && mv "$CS.new" "$CS"
            echo "=== sesudah ==="
            grep -n -B1 -A1 "vdso_clock_mode" "$CS" || true
          fi

          # 6. fungsi SUSFS dipanggil walau SUSFS tidak terpasang di source kernel
          PO=KernelSU/kernel/manager/pkg_observer.c
          if [ -f "$PO" ]; then
            echo "=== konteks susfs di pkg_observer.c ==="
            grep -n -B4 -A2 "susfs" "$PO" | head -60 || true
            if grep -q "susfs_parse_priority_app_strings" "$PO" && ! grep -rq "susfs_parse_priority_app_strings" include/linux 2>/dev/null; then
              line=$(grep -n '^#include' "$PO" | tail -1 | cut -d: -f1)
              sed -i "${line}a #ifndef susfs_parse_priority_app_strings\n#define susfs_parse_priority_app_strings(...) (0)\n#endif" "$PO"
              echo "stub susfs_parse_priority_app_strings dipasang"
            fi
          fi

          echo "=== Cek simbol: dipakai hook di kernel vs ada di SukiSU ==="
          for s in $(grep -ohE "ksu_[a-z0-9_]+" fs/exec.c fs/open.c fs/stat.c fs/read_write.c kernel/sys.c kernel/reboot.c drivers/input/input.c 2>/dev/null | sort -u); do
            if grep -rqE "\b$s\b" KernelSU/kernel; then echo "OK       $s"; else echo "MISSING  $s"; fi
          done

      - name: Build kernel
        env:
          ROOT_MODE: ${{ inputs.root }}
          HOOK_MODE: ${{ inputs.hook_mode }}
          QUICK: ${{ inputs.quick_check }}
        run: |
          cd kernel
          export TC="$GITHUB_WORKSPACE/tc/clang-r383902b/bin"
          export PATH="$TC:$PATH"
          export KROOT="$PWD"
          export OUT_DIR="$PWD/out"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export REAL_CC=clang
          export HOSTCC=gcc HOSTLD=ld HOSTAR=ar
          export LD=ld.lld
          export TARGET_BUILD_VARIANT=user
          export ENABLE_MIUI_DEBUGGING=false
          export DISABLE_WRAPPER=1
          JOBS="$(nproc)"
          export KBUILD_BUILD_USER="AETHERION"
          export KBUILD_BUILD_HOST="aetherion"

          MAKE_TOOLS=(
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
            HOSTCC=gcc HOSTLD=ld HOSTAR=ar
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
            KCFLAGS=-fno-temp-file
          )

          # 1. pakai defconfig bawaan tree (jangan digenerate ulang kalau sudah ada)
          DEF=arch/arm64/configs/vendor/renoir-qgki_defconfig
          if [ ! -f "$DEF" ]; then
            bash scripts/gki/generate_defconfig.sh vendor/renoir-qgki_defconfig
          fi
          echo "=== Opsi KMI/layout di defconfig bawaan ==="
          grep -E "KMI_|PCIEAER|TASK_DELAY_ACCT|BLK_WBT|QTI_SCMI_PLH|SONY_FF|ZRAM_WRITEBACK" "$DEF" || echo "(tidak ada di defconfig)"
          mkdir -p "$OUT_DIR"
          cp "$DEF" "$OUT_DIR/.config"
          make O="$OUT_DIR" "${MAKE_TOOLS[@]}" olddefconfig

          # 2. atur root SukiSU (tanpa hook manual, tanpa SUSFS)
          if [ "$ROOT_MODE" = "sukisu" ]; then
            ./scripts/config --file "$OUT_DIR/.config" -d KSU_MANUAL_HOOK -e KSU -d KSU_SUSFS
            if [ "$HOOK_MODE" = "branchlink" ]; then
              ./scripts/config --file "$OUT_DIR/.config" -d KSU_TAMPER_SYSCALL_TABLE -e KSU_HACK_ARM64_BRANCH_LINK
            else
              ./scripts/config --file "$OUT_DIR/.config" -d KSU_HACK_ARM64_BRANCH_LINK -e KSU_TAMPER_SYSCALL_TABLE
            fi
          fi

          # 3. opsi wajib agar modul vendor stock tetap bisa dimuat (lihat README tree)
          REQ="KMI_CRC_BYPASS KMI_VENDOR_SHIM PCIEAER TASK_DELAY_ACCT BLK_WBT QTI_SCMI_PLH_PROTOCOL SONY_FF ZRAM_WRITEBACK"
          for o in $REQ; do ./scripts/config --file "$OUT_DIR/.config" -e "$o"; done
          # nama kernel (kata "qgki" harus tetap ada)
          ./scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "-qgki-AETHERION-v0.1" -d LOCALVERSION_AUTO
          make O="$OUT_DIR" "${MAKE_TOOLS[@]}" olddefconfig

          # vdso32 butuh assembler ARM32 yang tidak ada di runner
          if grep -q "^CONFIG_COMPAT_VDSO=y" "$OUT_DIR/.config"; then
            ./scripts/config --file "$OUT_DIR/.config" -d COMPAT_VDSO
            make O="$OUT_DIR" "${MAKE_TOOLS[@]}" olddefconfig
          fi

          echo "=== Cek config penting ==="
          grep -E "CONFIG_LTO_CLANG|CONFIG_CFI_CLANG|CONFIG_SHADOW_CALL_STACK|CONFIG_KSU|KMI_CRC_BYPASS|KMI_VENDOR_SHIM|CONFIG_LOCALVERSION" "$OUT_DIR/.config" || true
          MISSING=""
          for o in $REQ; do
            grep -q "^CONFIG_$o=y" "$OUT_DIR/.config" || MISSING="$MISSING $o"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Opsi wajib belum aktif di .config:$MISSING"
            exit 1
          fi
          if ! grep -q "^CONFIG_LTO_CLANG=y" "$OUT_DIR/.config"; then
            echo "::error::LTO_CLANG hilang dari .config (toolchain tidak terdeteksi benar). Berhenti."
            exit 1
          fi
          if ! grep -q "^CONFIG_KSU=y" "$OUT_DIR/.config"; then
            echo "::error::CONFIG_KSU tidak aktif di .config. Berhenti."
            exit 1
          fi
          if [ "$ROOT_MODE" = "sukisu" ] && grep -q "^CONFIG_KSU_SUSFS=y" "$OUT_DIR/.config"; then
            echo "::error::KSU_SUSFS masih aktif padahal source kernel tidak punya SUSFS. Berhenti."
            exit 1
          fi

          # 4. siapkan file yang dibuat otomatis (compile.h dan flask.h) sebelum driver root dikompilasi
          if ! make O="$OUT_DIR" "${MAKE_TOOLS[@]}" -j"$JOBS" prepare scripts > prep.log 2>&1; then
            echo "prepare gagal:"; tail -n 40 prep.log; exit 1
          fi
          make O="$OUT_DIR" "${MAKE_TOOLS[@]}" -k -j"$JOBS" init/version.o security/selinux/ > gen.log 2>&1 || true
          if [ ! -f "$OUT_DIR/include/generated/compile.h" ]; then
            echo "::error::compile.h tidak terbentuk. 40 baris terakhir gen.log:"
            tail -n 40 gen.log
            exit 1
          fi
          if [ ! -f "$OUT_DIR/security/selinux/flask.h" ]; then
            echo "::error::flask.h tidak terbentuk. 40 baris terakhir gen.log:"
            tail -n 40 gen.log
            exit 1
          fi

          # 5. MODE CEK CEPAT: hanya driver root, tampilkan semua error sekaligus
          if [ "$QUICK" = "true" ]; then
            echo "=== MODE CEK CEPAT: kompilasi drivers/kernelsu saja ==="
            make O="$OUT_DIR" "${MAKE_TOOLS[@]}" -k -j"$JOBS" drivers/kernelsu/ > ksu.log 2>&1 || true
            echo "=== Pesan Kbuild SukiSU ==="
            grep -n "^-- " ksu.log | head -20 || true
            echo "===================== SEMUA ERROR drivers/kernelsu ====================="
            grep -nE "error:|fatal error|undefined" ksu.log | head -60 || true
            if grep -qE "error:|fatal error" ksu.log; then
              echo "::error::Masih ada error di driver root (lihat daftar di atas)."
              exit 1
            fi
            echo "drivers/kernelsu lolos kompilasi. Jalankan lagi dengan quick_check = false untuk build penuh."
            exit 0
          fi

          # 6. build penuh
          if ! make O="$OUT_DIR" "${MAKE_TOOLS[@]}" -j"$JOBS" Image > build.log 2>&1; then
            echo "Build gagal. Ulang 1 thread untuk nampilin error asli..."
            make O="$OUT_DIR" "${MAKE_TOOLS[@]}" -j1 Image > build-retry.log 2>&1 || true
            echo "===================== BARIS ERROR ====================="
            grep -nE "error:|Error |\*\*\*|No rule|undefined|not found|fatal" build.log build-retry.log | head -40
            echo "================= 40 BARIS TERAKHIR ==================="
            tail -n 40 build-retry.log
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/result"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/result/"
          cp "$OUT_DIR/.config" "$GITHUB_WORKSPACE/result/config.txt"
          cp "$OUT_DIR/include/config/kernel.release" "$GITHUB_WORKSPACE/result/" || true
          echo "root=$ROOT_MODE hook=$HOOK_MODE" > "$GITHUB_WORKSPACE/result/info.txt"
          (cd "$GITHUB_WORKSPACE/result" && sha256sum Image > Image.sha256 && ls -la)

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-Kernel-Image
          path: result/
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/*.log
          if-no-files-found: ignore
