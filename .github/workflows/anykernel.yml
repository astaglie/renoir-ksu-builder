name: Buat ZIP OrangeFox (AnyKernel3)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID run build yang sukses (angka di URL .../actions/runs/ID)"
        required: true
        default: "41304907452"

permissions:
  actions: read
  contents: read

jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - name: Download hasil build
        uses: actions/download-artifact@v4
        with:
          name: Renoir-Kernel-Image
          path: hasil
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ambil template AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Rakit zip
        run: |
          ls -la hasil
          if [ ! -f hasil/Image ]; then
            echo "::error::File Image tidak ditemukan di artifact"; exit 1
          fi
          file hasil/Image
          if ! file hasil/Image | grep -qi "ARM64"; then
            echo "::error::Image bukan kernel ARM64"; exit 1
          fi

          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 script: hanya mengganti kernel, ramdisk dan dtb bawaan dipertahankan
          properties() { '
          kernel.string=Renoir QGKI AETHERION + SukiSU
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=renoir
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          cp hasil/Image ak3/Image
          rm -rf ak3/.git ak3/.github ak3/README.md
          cd ak3
          zip -r9 ../Renoir-AETHERION-SukiSU-AK3.zip . -x ".git/*"
          cd ..
          unzip -l Renoir-AETHERION-SukiSU-AK3.zip | head -30
          sha256sum Renoir-AETHERION-SukiSU-AK3.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-AK3-ZIP
          path: Renoir-AETHERION-SukiSU-AK3.zip
